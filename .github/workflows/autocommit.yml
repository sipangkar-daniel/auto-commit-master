name: Auto commit

on:

  push:
    branches:
      - master

  schedule:
  - cron: "0 */5 * * *"

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - name: DEBUG
        run: echo "::debug::Ref = ${{github.ref}}"
      
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Modify last update
        run: |
          RAND=$((RANDOM % 2))
          D=$(date '+%Y-%m-%dT%H:%M:%SZ')
        
          echo "Status: RAND is $RAND at $D"
          
          if [ "$RAND" -eq 0 ]; then
            echo "Random skip triggered. Skipping this run..."
            exit 0
          fi
          
          echo "$D" > LAST_UPDATED
          echo "LAST_UPDATED file has been refreshed."

      - name: Commit changes
        run: |
          git config --local user.email "daniel222mu@gmail.com"
          git config --local user.name "Sipangkar"
          git add -A
          d=`date '+%Y-%m-%dT%H:%M:%SZ'`
          git commit -m "$d"

      - name: GitHub Push
        uses: ad-m/github-push-action@v0.6.0
        with:
          directory: "."
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true
